name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Bluetooth issues depend on the exact devices, so please fill in both.
  - type: input
    id: phone
    attributes:
      label: Phone running ZexDeck
      placeholder: e.g. Redmi Note 10S, Android 13 (MIUI 14)
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host device
      placeholder: e.g. Galaxy Tab S9 FE+, Android 16 / Arch Linux, BlueZ 5.87
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "From the phone: adb logcat -s HidKeyboard HidDeviceService BTIF_HD bt_hid"
      render: text
